  <!-- Eyes -->
  <ellipse cx="212" cy="254" rx="16" ry="20" fill="#202124"/>
  <ellipse cx="300" cy="254" rx="16" ry="20" fill="#202124"/>
  <circle cx="217" cy="247" r="5" fill="#FFFFFF"/>
  <circle cx="305" cy="247" r="5" fill="#FFFFFF"/>

  <!-- Body hint -->
  <rect x="196" y="316" width="120" height="40" rx="14" fill="#3DDC84"/>
  <rect x="212" y="330" width="88" height="6" rx="3" fill="#0F9D58" opacity="0.35"/>
