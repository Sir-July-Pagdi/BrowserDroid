  <path d="M56 116 A28 28 0 0 1 84 88 L428 88 A28 28 0 0 1 456 116 L456 160 L56 160 Z" fill="#F8F9FA"/>
  <circle cx="90" cy="112" r="10" fill="#EA4335"/>
  <circle cx="118" cy="112" r="10" fill="#FBBC05"/>
  <circle cx="146" cy="112" r="10" fill="#34A853"/>

  <!-- Address bar -->
  <rect x="176" y="96" width="224" height="32" rx="16" fill="#E8EAED"/>
  <circle cx="196" cy="112" r="7" fill="none" stroke="#80868B" stroke-width="2.5"/>
  <line x1="201" y1="117" x2="207" y2="123" stroke="#80868B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="214" y="108" width="110" height="8" rx="4" fill="#9AA0A6"/>

  <!-- Divider -->
