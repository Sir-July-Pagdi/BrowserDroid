  <line x1="208" y1="198" x2="188" y2="170" stroke="#3DDC84" stroke-width="10" stroke-linecap="round"/>
  <line x1="304" y1="198" x2="324" y2="170" stroke="#3DDC84" stroke-width="10" stroke-linecap="round"/>
  <circle cx="184" cy="164" r="10" fill="#3DDC84"/>
  <circle cx="328" cy="164" r="10" fill="#3DDC84"/>

  <!-- Android head - flat -->
